input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["platform-logs"]
    codec => "json"
    group_id => "logstash-group"
    auto_offset_reset => "latest"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "platform-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
